name: Publish Desktop Release (Yoclip Player)

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Yoclip renderer tag whose macOS release should be included
        required: true
        type: string
      release_tag:
        description: Target tag in this repository (defaults to source_tag)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: yoclip-desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release inputs
    runs-on: ubuntu-latest
    outputs:
      source_tag: ${{ steps.version.outputs.source_tag }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Normalize tags
        id: version
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" == v* ]] || SOURCE_TAG="v$SOURCE_TAG"
          TARGET="$RELEASE_TAG"
          [[ "$TARGET" == v* ]] || TARGET="v$TARGET"
          [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$TARGET" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TARGET" >> "$GITHUB_OUTPUT"
          echo "version=${TARGET#v}" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux x64 Studio
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOCLIP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out renderer source
        uses: actions/checkout@v4
        with:
          repository: IstiN/yoclip
          token: ${{ secrets.YOCLIP_RENDERER_TOKEN }}
          ref: ${{ needs.prepare.outputs.source_tag }}
          submodules: recursive
          path: yoclip

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            ffmpeg xvfb xauth file \
            libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers

      - name: Resolve Flutter dependencies
        working-directory: yoclip/packages/yoclip_player
        run: flutter pub get

      - name: Build release bundle
        working-directory: yoclip/packages/yoclip_player
        run: |
          flutter build linux --release --build-name="$YOCLIP_VERSION"
          test -x build/linux/x64/release/bundle/yoclip_player
          test -s build/linux/x64/release/bundle/libqjs_wrapper.so

      - name: Verify native runtime dependencies
        working-directory: yoclip/packages/yoclip_player
        run: |
          set -euo pipefail
          BUNDLE=build/linux/x64/release/bundle
          while IFS= read -r -d '' library; do
            echo "Checking $library"
            if ldd "$library" | grep -F 'not found'; then
              echo "Unresolved native dependency in $library" >&2
              exit 1
            fi
          done < <(find "$BUNDLE" -type f \( -name '*.so' -o -name 'yoclip_player' \) -print0)

      - name: Smoke-test Studio startup
        working-directory: yoclip/packages/yoclip_player
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/yoclip-linux-startup.log"
          set +e
          timeout 20s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            build/linux/x64/release/bundle/yoclip_player >"$LOG" 2>&1
          STATUS=$?
          set -e
          cat "$LOG"
          if [ "$STATUS" -ne 124 ]; then
            echo "Studio did not stay running until the 20-second timeout (exit $STATUS)" >&2
            exit 1
          fi
          echo "Studio started successfully and remained running for 20 seconds."

      - name: Package Linux archive and Debian package
        working-directory: yoclip/packages/yoclip_player
        run: |
          set -euo pipefail
          BUNDLE="$PWD/build/linux/x64/release/bundle"
          OUT="$RUNNER_TEMP/desktop-release"
          PKG="$RUNNER_TEMP/yoclip-player-debian"
          rm -rf "$OUT" "$PKG"
          mkdir -p "$OUT/yoclip-player" "$PKG/DEBIAN" "$PKG/opt/yoclip-player"
          mkdir -p "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/scalable/apps"

          cp -a "$BUNDLE/." "$OUT/yoclip-player/"
          tar -czf "$OUT/yoclip-player-linux-x64-$YOCLIP_VERSION.tar.gz" \
            -C "$OUT" yoclip-player

          cp -a "$BUNDLE/." "$PKG/opt/yoclip-player/"
          cat >"$PKG/DEBIAN/control" <<EOF
          Package: yoclip-player
          Version: $YOCLIP_VERSION
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: Yoclip Contributors <noreply@users.noreply.github.com>
          Depends: libgtk-3-0 | libgtk-3-0t64, libglib2.0-0 | libglib2.0-0t64, libstdc++6, libgstreamer1.0-0 | libgstreamer1.0-0t64, gstreamer1.0-plugins-base
          Description: Code-first video generation studio
           Yoclip Player previews JavaScript scenes, edits timelines and
           exports video with the Flutter rendering engine.
          EOF
          sed -i 's/^          //' "$PKG/DEBIAN/control"
          cat >"$PKG/usr/share/applications/yoclip-player.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Yoclip Player
          Comment=Code-first video generation studio
          Exec=/opt/yoclip-player/yoclip_player
          Icon=yoclip-player
          Terminal=false
          Categories=AudioVideo;Video;Development;
          StartupWMClass=studio.yoclip.player
          EOF
          sed -i 's/^          //' "$PKG/usr/share/applications/yoclip-player.desktop"
          cp assets/branding/yoclip_icon.svg \
            "$PKG/usr/share/icons/hicolor/scalable/apps/yoclip-player.svg"
          dpkg-deb --build --root-owner-group "$PKG" \
            "$OUT/yoclip-player-linux-x64-$YOCLIP_VERSION.deb"

          dpkg-deb --info "$OUT/yoclip-player-linux-x64-$YOCLIP_VERSION.deb"
          ls -lh "$OUT"/*.tar.gz "$OUT"/*.deb

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: yoclip-player-linux-x64
          path: ${{ runner.temp }}/desktop-release/*
          if-no-files-found: error
          retention-days: 7

  collect-macos:
    name: Collect signed macOS assets
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download macOS release from renderer repository
        env:
          GH_TOKEN: ${{ secrets.YOCLIP_RENDERER_TOKEN }}
          SOURCE_TAG: ${{ needs.prepare.outputs.source_tag }}
        run: |
          set -euo pipefail
          mkdir -p macos
          gh release view "$SOURCE_TAG" \
            --repo IstiN/yoclip \
            --json assets > macos/source-assets.json
          gh release download "$SOURCE_TAG" \
            --repo IstiN/yoclip \
            --dir macos \
            --pattern '*.dmg' \
            --pattern '*-mac.zip' \
            --pattern 'latest-mac.yml'
          test "$(find macos -name '*.dmg' -type f | wc -l)" -eq 2
          test "$(find macos -name '*-mac.zip' -type f | wc -l)" -ge 2
          test -s macos/latest-mac.yml
          ls -lh macos

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: yoclip-player-macos
          path: macos/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Linux and macOS release
    needs: [prepare, build-linux, collect-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: yoclip-player-*
          merge-multiple: true
      - name: Verify platform completeness and write release notes
        env:
          SOURCE_TAG: ${{ needs.prepare.outputs.source_tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMGS=(assets/*.dmg)
          MAC_ZIPS=(assets/*-mac.zip)
          LINUX_ARCHIVES=(assets/yoclip-player-linux-x64-*.tar.gz)
          LINUX_PACKAGES=(assets/yoclip-player-linux-x64-*.deb)
          [ "${#DMGS[@]}" -eq 2 ]
          [ "${#MAC_ZIPS[@]}" -ge 2 ]
          [ "${#LINUX_ARCHIVES[@]}" -eq 1 ]
          [ "${#LINUX_PACKAGES[@]}" -eq 1 ]
          [[ "${DMGS[*]}" == *arm64* ]]
          [[ "${DMGS[*]}" == *x86_64* ]]
          [[ "${LINUX_ARCHIVES[0]}" == *"$VERSION"* ]]
          grep -q "^version: $VERSION$" assets/latest-mac.yml
          rm -f assets/source-assets.json assets/SHA256SUMS
          (cd assets && sha256sum ./*.dmg ./*-mac.zip ./*.tar.gz ./*.deb > SHA256SUMS)
          cat > release-notes.md <<EOF
          Yoclip Player $RELEASE_TAG for Linux and macOS.


          ## Install


          - **Linux x64**: use the \`.deb\` on Debian/Ubuntu, or unpack the \`.tar.gz\` and run \`./yoclip-player/yoclip_player\`.
          - **macOS Apple Silicon**: download the \`arm64\` DMG.
          - **macOS Intel**: download the \`x86_64\` DMG.
          - The versioned ZIP files and \`latest-mac.yml\` are included for the macOS update feed.


          Renderer source: [IstiN/yoclip $SOURCE_TAG](https://github.com/IstiN/yoclip/tree/$SOURCE_TAG).

          Checksums for every asset are in \`SHA256SUMS\`.
          EOF
          ls -lh assets

      - name: Create release in yoclip-examples
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ASSETS=(assets/*.dmg assets/*-mac.zip assets/latest-mac.yml assets/*.tar.gz assets/*.deb assets/SHA256SUMS)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for asset in "${ASSETS[@]}"; do
              gh release upload "$RELEASE_TAG" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
            done
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Yoclip Player $RELEASE_TAG" --notes-file release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Yoclip Player $RELEASE_TAG" \
              --notes-file release-notes.md \
              --latest \
              "${ASSETS[@]}"
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,assets --jq '{url,assets:[.assets[].name]}'
