name: Publish Studio Samples gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gallery.json
      - tools/build_gallery.py
      - samples/**
      - .github/workflows/gallery.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-samples-gallery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GALLERY_BUILD: ${{ github.workspace }}/build
    defaults:
      run:
        working-directory: examples
    steps:
      - name: Check out examples
        uses: actions/checkout@v4
        with:
          path: examples
      - name: Check out Yoclip renderer
        uses: actions/checkout@v4
        with:
          repository: IstiN/yoclip
          token: ${{ secrets.YOCLIP_RENDERER_TOKEN }}
          submodules: recursive
          path: yoclip
      - name: Sync current examples in renderer workspace
        working-directory: yoclip/samples
        run: |
          git fetch origin main
          git checkout origin/main
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install headless native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang ffmpeg xvfb xauth file python3-pil \
            libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers
      - name: Resolve CLI dependencies
        working-directory: yoclip/packages/yoclip_cli
        run: flutter pub get
      - name: Prepare gallery preview plan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          catalog = json.loads(Path('gallery.json').read_text())
          previews = Path(os.environ['GALLERY_BUILD']) / 'gallery-previews'
          previews.mkdir(parents=True, exist_ok=True)
          with (previews / 'plan.tsv').open('w') as plan:
              for sample in catalog['samples']:
                  plan.write('\t'.join([
                      sample['id'],
                      sample['project'],
                      str(sample.get('posterAt', 1.5)),
                      str(sample.get('previewFrames', 150)),
                      str(sample.get('previewPreset', '')),
                      str(sample.get('previewFps', '')),
                  ]) + '\n')
          print(f"Prepared {len(catalog['samples'])} sample previews")
          PY
      - name: Render preview MP4 and capture poster
        working-directory: yoclip/packages/yoclip_cli
        run: |
          set -euo pipefail
          PREVIEWS="$GALLERY_BUILD/gallery-previews"
          while IFS=$'\t' read -r sample_id project poster_at preview_frames preview_preset preview_fps; do
            [ -n "$sample_id" ] || continue
            PROJECT_DIR="$GITHUB_WORKSPACE/yoclip/samples/$project"
            preset_args=()
            fps_args=()
            [ -z "$preview_preset" ] || preset_args=(--preset "$preview_preset")
            [ -z "$preview_fps" ] || fps_args=(--fps "$preview_fps")
            echo "=== Gallery sample: $sample_id ($project) ==="
            xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 YOCLIP_FLUTTER_GPU=1 \
              dart run bin/yoclip.dart render \
              --project "$PROJECT_DIR" \
              --output "$PREVIEWS/$sample_id.mp4" \
              --duration "$preview_frames" "${preset_args[@]}" "${fps_args[@]}"
            test -s "$PREVIEWS/$sample_id.mp4"
            xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 YOCLIP_FLUTTER_GPU=1 \
              dart run bin/yoclip.dart screenshot \
              --project "$PROJECT_DIR" \
              --at "$poster_at" \
              --output "$PREVIEWS/$sample_id.png" "${preset_args[@]}"
            test -s "$PREVIEWS/$sample_id.png"
            ls -lh "$PREVIEWS/$sample_id.mp4" "$PREVIEWS/$sample_id.png"
            rm -rf "$PROJECT_DIR/.yoclip_cache/external"
          done < "$PREVIEWS/plan.tsv"
      - name: Reject flat placeholder previews
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          from PIL import Image, ImageStat
          path = Path(os.environ['GALLERY_BUILD']) / 'gallery-previews/yoclip_intro.png'
          image = Image.open(path).convert('RGB')
          w, h = image.size
          # The intro media area must contain real imagery. A flat gradient
          # here means the external video layer failed or is still a placeholder.
          crop = image.crop((int(w*.25), int(h*.20), int(w*.75), int(h*.62)))
          crop = crop.resize((192, 108))
          deviation = sum(ImageStat.Stat(crop).stddev) / 3
          print(f'Intro poster detail (mean RGB stddev): {deviation:.2f}')
          if deviation < 12.0:
              raise SystemExit('Flat video layer detected in gallery poster')

          # A mostly empty poster usually means posterAt landed on a fade,
          # reset or blank transition rather than a representative frame.
          for poster in sorted(path.parent.glob('*.png')):
              sample = Image.open(poster).convert('RGB').resize((192, 108))
              detail = sum(ImageStat.Stat(sample).stddev) / 3
              print(f'{poster.stem} poster detail (mean RGB stddev): {detail:.2f}')
              if detail < 4.0:
                  raise SystemExit(f'Flat or empty gallery poster: {poster.name}')
          PY
      - name: Package immutable source and media artifacts
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/build_gallery.py \
            --previews "$GALLERY_BUILD/gallery-previews" \
            --output "$GALLERY_BUILD/gallery"
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.GALLERY_BUILD }}/gallery

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
