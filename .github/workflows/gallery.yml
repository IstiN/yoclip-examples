name: Publish Studio Samples gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gallery.json
      - tools/build_gallery.py
      - samples/**
      - .github/workflows/gallery.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-samples-gallery
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.samples.outputs.matrix }}
    steps:
      - name: Check out examples
        uses: actions/checkout@v4
        with:
          path: examples
      - name: Prepare full-preview matrix
        id: samples
        working-directory: examples
        run: |
          python3 - <<'PY' > "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          catalog = json.loads(Path('gallery.json').read_text())
          gpu_samples = {
              'yoclip_big_idea_v2',
              'yoclip_level_up',
              'yoclip_threejs',
              'yoclip_write_the_light',
          }
          include = []
          for sample in catalog['samples']:
              include.append({
                  'sample_id': sample['id'],
                  'project': sample['project'],
                  'poster_at': str(sample.get('posterAt', 1.5)),
                  'preview_frames': str(sample.get('previewFrames', '')),
                  'preview_preset': sample.get('previewPreset', ''),
                  'preview_fps': str(sample.get('previewFps', '')),
                  'runner': 'macos-14' if sample['id'] in gpu_samples else 'ubuntu-latest',
              })
          print('matrix=' + json.dumps({'include': include}))
          PY

  render:
    needs: prepare
    name: Render ${{ matrix.sample_id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out Yoclip renderer
        uses: actions/checkout@v4
        with:
          repository: IstiN/yoclip
          token: ${{ secrets.YOCLIP_RENDERER_TOKEN }}
          submodules: recursive
          path: yoclip
      - name: Sync current examples in renderer workspace
        working-directory: yoclip/samples
        run: |
          git fetch origin main
          git checkout origin/main
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve CLI dependencies
        working-directory: yoclip/packages/yoclip_cli
        run: flutter pub get
      - name: Install headless native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang ffmpeg xvfb xauth file python3-pil \
            libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers
      - name: Render full preview MP4 and capture poster
        working-directory: yoclip/packages/yoclip_cli
        env:
          SAMPLE_ID: ${{ matrix.sample_id }}
          SAMPLE_PROJECT: ${{ matrix.project }}
          POSTER_AT: ${{ matrix.poster_at }}
          PREVIEW_FRAMES: ${{ matrix.preview_frames }}
          PREVIEW_PRESET: ${{ matrix.preview_preset }}
          PREVIEW_FPS: ${{ matrix.preview_fps }}
          PREVIEW_DIR: ${{ github.workspace }}/gallery-preview
        run: |
          set -euo pipefail
          mkdir -p "$PREVIEW_DIR"
          PROJECT_DIR="$GITHUB_WORKSPACE/yoclip/samples/$SAMPLE_PROJECT"
          preset_args=()
          fps_args=()
          duration_args=()
          render_env=()
          [ -z "$PREVIEW_PRESET" ] || preset_args=(--preset "$PREVIEW_PRESET")
          [ -z "$PREVIEW_FPS" ] || fps_args=(--fps "$PREVIEW_FPS")
          [ -z "$PREVIEW_FRAMES" ] || duration_args=(--duration "$PREVIEW_FRAMES")
          if [ "$RUNNER_OS" = "Linux" ]; then
            render_env=(xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 YOCLIP_FLUTTER_GPU=1)
          fi
          echo "=== Gallery sample: $SAMPLE_ID ($SAMPLE_PROJECT) ==="
          "${render_env[@]}" dart run bin/yoclip.dart render \
            --project "$PROJECT_DIR" \
            --output "$PREVIEW_DIR/$SAMPLE_ID.mp4" \
            "${duration_args[@]}" "${preset_args[@]}" "${fps_args[@]}"
          test -s "$PREVIEW_DIR/$SAMPLE_ID.mp4"
          "${render_env[@]}" dart run bin/yoclip.dart screenshot \
            --project "$PROJECT_DIR" \
            --at "$POSTER_AT" \
            --output "$PREVIEW_DIR/$SAMPLE_ID.png" "${preset_args[@]}"
          test -s "$PREVIEW_DIR/$SAMPLE_ID.png"
          ls -lh "$PREVIEW_DIR/$SAMPLE_ID.mp4" "$PREVIEW_DIR/$SAMPLE_ID.png"
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.sample_id }}
          path: ${{ env.PREVIEW_DIR }}/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 1

  package:
    needs: [prepare, render]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GALLERY_BUILD: ${{ github.workspace }}/build
    steps:
      - name: Check out examples
        uses: actions/checkout@v4
        with:
          path: examples
      - name: Download full previews
        uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          path: ${{ env.GALLERY_BUILD }}/gallery-previews
          merge-multiple: true
      - name: Reject flat placeholder previews
        working-directory: examples
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          from PIL import Image, ImageStat
          path = Path(os.environ['GALLERY_BUILD']) / 'gallery-previews/yoclip_intro.png'
          image = Image.open(path).convert('RGB')
          w, h = image.size
          crop = image.crop((int(w*.25), int(h*.20), int(w*.75), int(h*.62)))
          crop = crop.resize((192, 108))
          deviation = sum(ImageStat.Stat(crop).stddev) / 3
          print(f'Intro poster detail (mean RGB stddev): {deviation:.2f}')
          if deviation < 12.0:
              raise SystemExit('Flat video layer detected in gallery poster')

          for poster in sorted(path.parent.glob('*.png')):
              sample = Image.open(poster).convert('RGB').resize((192, 108))
              detail = sum(ImageStat.Stat(sample).stddev) / 3
              print(f'{poster.stem} poster detail (mean RGB stddev): {detail:.2f}')
              if detail < 4.0:
                  raise SystemExit(f'Flat or empty gallery poster: {poster.name}')
          PY
      - name: Verify full preview durations
        working-directory: examples
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          import subprocess

          previews = Path(os.environ['GALLERY_BUILD']) / 'gallery-previews'
          catalog = json.loads(Path('gallery.json').read_text())
          for sample in catalog['samples']:
              path = previews / f"{sample['id']}.mp4"
              duration = float(subprocess.check_output([
                  'ffprobe', '-v', 'error', '-select_streams', 'v:0',
                  '-show_entries', 'stream=duration', '-of', 'default=nw=1:nk=1',
                  str(path),
              ]))
              yaml = (Path(sample['project']) / 'yoclip.yaml').read_text()
              fps = int(sample.get('previewFps') or re.search(
                  r'^\s*fps:\s*(\d+)', yaml, re.M).group(1))
              expected = int(sample['previewFrames']) / fps
              if abs(duration - expected) > max(0.25, 2 / fps):
                  raise SystemExit(
                      f"Preview duration mismatch: {sample['id']} "
                      f"expected {expected:.2f}s, got {duration:.2f}s"
                  )
              print(f"{sample['id']}: {duration:.2f}s (full)")
          PY
      - name: Package immutable source and media artifacts
        working-directory: examples
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/build_gallery.py \
            --previews "$GALLERY_BUILD/gallery-previews" \
            --output "$GALLERY_BUILD/gallery"
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.GALLERY_BUILD }}/gallery

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
