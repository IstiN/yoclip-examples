name: Publish Studio Samples gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gallery.json
      - tools/build_gallery.py
      - samples/yoclip_intro/**
      - .github/workflows/gallery.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-samples-gallery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GALLERY_BUILD: ${{ github.workspace }}/build
    defaults:
      run:
        working-directory: examples
    steps:
      - name: Check out examples
        uses: actions/checkout@v4
        with:
          path: examples
      - name: Check out Yoclip renderer
        uses: actions/checkout@v4
        with:
          repository: IstiN/yoclip
          token: ${{ secrets.YOCLIP_RENDERER_TOKEN }}
          submodules: recursive
          path: yoclip
      - name: Sync current examples in renderer workspace
        working-directory: yoclip/samples
        run: |
          git fetch origin main
          git checkout origin/main
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install headless native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang ffmpeg xvfb xauth file python3-pil \
            libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers
      - name: Resolve CLI dependencies
        working-directory: yoclip/packages/yoclip_cli
        run: flutter pub get
      - name: Render preview MP4
        working-directory: yoclip/packages/yoclip_cli
        run: |
          mkdir -p "$GALLERY_BUILD/gallery-previews"
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            dart run bin/yoclip.dart render \
            --project ../../samples/samples/yoclip_intro \
            --output "$GALLERY_BUILD/gallery-previews/yoclip_intro.mp4"
          test -s "$GALLERY_BUILD/gallery-previews/yoclip_intro.mp4"
          ls -lh "$GALLERY_BUILD/gallery-previews/yoclip_intro.mp4"
      - name: Capture poster
        working-directory: yoclip/packages/yoclip_cli
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            dart run bin/yoclip.dart screenshot \
            --project ../../samples/samples/yoclip_intro \
            --at 1.5 \
            --output "$GALLERY_BUILD/gallery-previews/yoclip_intro.png"
          test -s "$GALLERY_BUILD/gallery-previews/yoclip_intro.png"
      - name: Reject flat placeholder previews
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          from PIL import Image, ImageStat
          path = Path(os.environ['GALLERY_BUILD']) / 'gallery-previews/yoclip_intro.png'
          image = Image.open(path).convert('RGB')
          w, h = image.size
          # The central media card must contain real imagery. A flat gradient
          # here means the external video layer failed or is still a placeholder.
          crop = image.crop((int(w*.25), int(h*.20), int(w*.75), int(h*.62)))
          crop = crop.resize((192, 108))
          deviation = sum(ImageStat.Stat(crop).stddev) / 3
          print(f'Central poster detail (mean RGB stddev): {deviation:.2f}')
          if deviation < 12.0:
              raise SystemExit('Flat video layer detected in gallery poster')
          PY
      - name: Package immutable source and media artifacts
        run: |
          python3 tools/build_gallery.py \
            --previews "$GALLERY_BUILD/gallery-previews" \
            --output "$GALLERY_BUILD/gallery"
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.GALLERY_BUILD }}/gallery

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
