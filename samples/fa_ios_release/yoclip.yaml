# Fa iOS release — vertical & horizontal, dark & light, one codebase.
#
# Music grid: 150 BPM (bar = 48 frames, downbeats at frame 26 + 48k).
#   00_intro     0-451    Grok intro video at native tempo (speed 0.8):
#                        picture+sound run to the source end (~15s). From
#                        300 (10s) the hook renders above it — the intro's
#                        last audio plays on underneath (background bed).
#   01_hook      300-470  "Build an iOS app — on your iPhone?" hook
#   02_download  470-662  QR + fa1.dev + App Store card
#   03_connect   662-806  Connect your AI provider (BYOK)
#   04_ask       806-998  Chat: flutter engine, sqlite, flame3d
#   05_build     998-1238 Generation montage: 4 apps being built
#   06_publish   1238-1430Widget catalog + publish
#   07_lockup    1430-1634Fa mark + "First real mobile AI harness"
#
# NOTE: the -132 shift from the original grid (hook overlays the intro from
# 10s) puts later cuts off the 150 BPM downbeat grid — revisit if the music feels off.
#
# Variants retarget theme (params.mode → faTheme()) and resolution
# (width/height → yoclipFormat.orientation). Render with:
#   yoclip render --project samples/samples/fa_ios_release --variant dark_vertical

config:
  duration: 1634
  fps: 30
  width: 1920
  height: 1080
  background: '#070a12'

project_js: project.js

variants:
  - id: dark_horizontal
    label: Dark · Horizontal
    params:
      mode: dark
  - id: dark_vertical
    label: Dark · Vertical
    width: 1080
    height: 1920
    params:
      mode: dark
  - id: light_horizontal
    label: Light · Horizontal
    params:
      mode: light
    theme:
      colors:
        background: '#F5F5F7'
  - id: light_vertical
    label: Light · Vertical
    width: 1080
    height: 1920
    params:
      mode: light
    theme:
      colors:
        background: '#F5F5F7'

scenes:
  - scenes/00_intro.scene.js
  - scenes/01_hook.scene.js
  - scenes/02_download.scene.js
  - scenes/03_connect.scene.js
  - scenes/04_ask.scene.js
  - scenes/05_build.scene.js
  - scenes/06_publish.scene.js
  - scenes/07_lockup.scene.js

theme:
  colors:
    background: '#070a12'
    blue: '#5B61F6'
    blueBright: '#6E74FF'
    teal: '#2EBD9E'
    tealBright: '#5CE8CF'
    violet: '#8F6BFF'
    violetBright: '#C9B8FF'

external_assets:
  intro_video:
    type: video
    path: assets/video/intro_video.mp4

audio:
  tracks:
    # Intro video audio is auto-extracted from external:intro_video by the
    # engine (video_intro_video track) — do NOT add it here manually.
    - source: assets/audio/background_music.mp3
      start: 0
      volume: 0.8
      loop: false
      envelope:
        # 10% bed under the intro video, fade up into the first content cut
        - frame: 0
          volume: 0.1
        - frame: 276
          volume: 0.8
          ramp: 24
