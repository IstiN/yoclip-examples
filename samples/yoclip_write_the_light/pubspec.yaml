name: yoclip_write_the_light
description: Write the Light — a story-driven YoClip music video rendered with Flutter GPU.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  flutter:
    sdk: flutter
  yoclip_core:
    path: ../../../packages/yoclip_core
  yoclip_encoder:
    path: ../../../packages/yoclip_encoder

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - three/
    - three/ldraw/
    - assets/images/
    - assets/audio/
    - assets/fonts/
