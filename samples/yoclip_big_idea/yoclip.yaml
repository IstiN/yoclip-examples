config:
  duration: 2580
  fps: 30
  width: 1920
  height: 1080
  background: '#0a0a12'

theme:
  colors:
    background: '#0a0a12'
    backgroundSoft: '#0d0d18'
    backgroundDeep: '#07070d'
    surface: '#15131f'
    text: '#ffffff'
    textMuted: '#a1a1aa'
    primary: '#7c3aed'
    primaryLight: '#a78bfa'
    accent: '#22d3ee'
  headline:
    fontSize: 96
    fontFamily: Geneva
    fontWeight: 700
  subline:
    fontSize: 40
    fontFamily: Geneva
  label:
    fontSize: 26
    fontFamily: Geneva
    fontWeight: 600
    letterSpacing: 8

project_js: project.js

scenes:
  - scenes/background.scene.js
  - scenes/00_hook.scene.js
  - scenes/01_worlds.scene.js
  - scenes/02_logo.scene.js
  - scenes/03_prompt.scene.js
  - scenes/04_chat.scene.js
  - scenes/05_code.scene.js
  - scenes/06_variants.scene.js
  - scenes/07_stats.scene.js
  - scenes/08_goldens.scene.js
  - scenes/09_export.scene.js
  - scenes/10_flythrough.scene.js
  - scenes/11_cta.scene.js

external_assets:
  logo:
    type: image
    path: assets/images/yoclip_logo.svg
  logo_on_light:
    type: image
    path: assets/images/yoclip_logo_on_light.svg
  golden_hollywood:
    type: image
    path: assets/goldens/hollywood.png
  golden_banner:
    type: image
    path: assets/goldens/banner.png
  golden_rally:
    type: image
    path: assets/goldens/rally.png
  golden_code:
    type: image
    path: assets/goldens/code.png
  golden_helmet:
    type: image
    path: assets/goldens/helmet.png
  golden_cta:
    type: image
    path: assets/goldens/cta.png

audio:
  tracks:
    # Placeholder score (see MUSIC_PROMPT.md — swap in the real Suno render
    # under the same filename). Envelope ducks before the big cuts and fades
    # out under the end card. NOTE: envelope ramps are honored by Studio
    # preview/export; `yoclip render` CLI plays tracks at constant volume.
    - source: assets://audio/score_placeholder.mp3
      start: 0
      volume: 0.85
      envelope:
        - frame: 96
          volume: 0.4
          ramp: 24
        - frame: 120
          volume: 1.0
          ramp: 2
        - frame: 276
          volume: 0.4
          ramp: 24
        - frame: 300
          volume: 1.0
          ramp: 2
        - frame: 2046
          volume: 0.5
          ramp: 24
        - frame: 2070
          volume: 1.0
          ramp: 2
        - frame: 2460
          volume: 0.0
          ramp: 120

# Video variants — one project, many renders. Pick one in the Studio
# Variants panel (or `yoclip render -V <id>`). Params reach scenes as
# `yoclipVariant` (lang drives the yoclipTexts dictionaries in project.js,
# logo swaps the wordmark for light backgrounds); theme overrides deep-merge
# over the base theme above.
variants:
  - id: dark_en
    label: 'Dark · EN'
    params:
      lang: 'en'
  - id: dark_ru
    label: 'Dark · RU'
    params:
      lang: 'ru'
  - id: light_en
    label: 'Light · EN'
    params:
      lang: 'en'
      logo: 'external:logo_on_light'
    theme:
      colors:
        background: '#f4f3fa'
        backgroundSoft: '#ffffff'
        backgroundDeep: '#e6e4f2'
        surface: '#ffffff'
        text: '#14121f'
        textMuted: '#5c5870'
        primary: '#7c3aed'
        primaryLight: '#6d28d9'
        accent: '#0891b2'
      headline:
        color: '#14121f'
      subline:
        color: '#5c5870'
      label:
        color: '#6d28d9'
  - id: light_ru
    label: 'Light · RU'
    params:
      lang: 'ru'
      logo: 'external:logo_on_light'
    theme:
      colors:
        background: '#f4f3fa'
        backgroundSoft: '#ffffff'
        backgroundDeep: '#e6e4f2'
        surface: '#ffffff'
        text: '#14121f'
        textMuted: '#5c5870'
        primary: '#7c3aed'
        primaryLight: '#6d28d9'
        accent: '#0891b2'
      headline:
        color: '#14121f'
      subline:
        color: '#5c5870'
      label:
        color: '#6d28d9'
  - id: shorts_en
    label: 'Shorts · EN'
    # Explicit resolution retargets the whole render to vertical — scenes
    # re-render natively at 1080x1920 (yoclipFormat.orientation = 'portrait')
    # instead of being letterboxed from the landscape master.
    width: 1080
    height: 1920
    params:
      lang: 'en'
