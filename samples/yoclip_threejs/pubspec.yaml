name: yoclip_threejs
description: A 120-second code-first YoClip promo with native upstream THREE.js.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  flutter:
    sdk: flutter
  yoclip_core:
    path: ../../../packages/yoclip_core
  yoclip_encoder:
    path: ../../../packages/yoclip_encoder

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - three/
    - assets/images/
    - assets/audio/
    - assets/fonts/
