config:
  duration: 360
  fps: 30
  width: 1920
  height: 1080
  background: '#0a0a12'

# Shared helpers (sequence + elapsedMs) and theme/anchors live in project.js.
project_js: project.js

scenes:
  - scenes/01_shapes.scene.js
  - scenes/02_motion.scene.js
  - scenes/03_sequence.scene.js

theme:
  colors:
    background: '#0a0a12'
    surface: '#15131f'
    text: '#ffffff'
    textMuted: '#a1a1aa'
    primary: '#7c3aed'
    primaryLight: '#a78bfa'
    accent: '#22d3ee'
    warning: '#f59e0b'
    danger: '#ef4444'
  headline:
    fontSize: 88
    fontFamily: Geneva
    fontWeight: 700
  label:
    fontSize: 30
    fontFamily: Geneva
    fontWeight: 600
